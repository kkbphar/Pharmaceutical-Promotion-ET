<script>

/* =====================================================
ADMIN COSMETICS TABLE
===================================================== */

async function loadAdminCosmetics(){

    const container =
        document.getElementById(
            "adminCosmeticsTable"
        );

    if(!container){

        return;
    }

    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .from("cosmetics")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );

        if(error){

            throw error;
        }

        if(!data ||
           data.length === 0){

            container.innerHTML = `
                <div class="empty-state">

                    <h3>
                        No cosmetics
                    </h3>

                    <p>
                        No cosmetics have been added yet.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML = `

            <table>

                <thead>

                    <tr>

                        <th>
                            Image
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Brand
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody>

                    ${
                        data
                        .map(
                            cosmetic => `

                                <tr>

                                    <td>

                                        ${
                                            cosmetic.image_url
                                            ? `
                                                <img
                                                    src="${escapeHtml(
                                                        cosmetic.image_url
                                                    )}"
                                                    alt="${escapeHtml(
                                                        cosmetic.name
                                                    )}"
                                                    style="
                                                        width:55px;
                                                        height:55px;
                                                        object-fit:cover;
                                                        border-radius:8px;
                                                    "
                                                >
                                            `
                                            : "No image"
                                        }

                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            cosmetic.name ||
                                            ""
                                        )}
                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            cosmetic.brand ||
                                            ""
                                        )}
                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            cosmetic.category ||
                                            ""
                                        )}
                                    </td>

                                    <td>

                                        ${
                                            cosmetic.price !==
                                            null &&
                                            cosmetic.price !==
                                            undefined

                                            ? Number(
                                                cosmetic.price
                                            ).toLocaleString() +
                                            " ETB"

                                            : "-"
                                        }

                                    </td>

                                    <td>

                                        <button
                                            class="danger"
                                            onclick="deleteCosmetic('${cosmetic.id}')"
                                        >
                                            Delete
                                        </button>

                                    </td>

                                </tr>

                            `
                        )
                        .join("")
                    }

                </tbody>

            </table>

        `;

    }
    catch(error){

        console.error(
            "Admin cosmetics error:",
            error
        );

        container.innerHTML = `
            <div class="empty-state">

                <h3>
                    Unable to load cosmetics
                </h3>

                <p>
                    ${escapeHtml(
                        error.message ||
                        "Please try again."
                    )}
                </p>

            </div>
        `;

    }

}


/* =====================================================
DELETE COSMETIC
===================================================== */

async function deleteCosmetic(
    cosmeticId
){

    if(!cosmeticId){

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this cosmetic?"
        );


    if(!confirmed){

        return;
    }


    try{

        const {
            error
        } =
            await supabaseClient
            .from("cosmetics")
            .delete()
            .eq(
                "id",
                cosmeticId
            );


        if(error){

            throw error;
        }


        await loadAdminCosmetics();

        await loadAdminStats();

        await loadPublicCosmetics();

    }
    catch(error){

        console.error(
            "Delete cosmetic error:",
            error
        );

        alert(
            "Unable to delete cosmetic: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =====================================================

/* =====================================================
AUTH STATE LISTENER
===================================================== */

supabaseClient
.auth
.onAuthStateChange(
    async function(
        event,
        session
    ){

        currentUser =
            session &&
            session.user
                ? session.user
                : null;


        await updateNavigation();


        if(
            event ===
            "SIGNED_IN"
        ){

            const isAdmin =
                currentUser
                ? await checkAdmin(
                    currentUser.id
                )
                : false;


            if(isAdmin){

                await loadAdminDashboard();

            }

        }

    }
);


/* =====================================================
INITIALIZE APPLICATION
===================================================== */

async function initializeApp(){

    try{

        await getCurrentUser();

        await updateNavigation();

        await Promise.all([

            loadPublicProducts(),

            loadPublicCosmetics(),

            loadSuppliers(),

            loadOrderProducts()

        ]);


        /*
         * If a logged-in administrator opens
         * the website, prepare the dashboard.
         */

        if(currentUser){

            const isAdmin =
                await checkAdmin(
                    currentUser.id
                );


            if(isAdmin){

                await loadAdminDashboard();

            }

        }

    }
    catch(error){

        console.error(
            "Application initialization error:",
            error
        );

    }

}


/* =====================================================
START APPLICATION
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initializeApp();

    }
);


/* =====================================================
GLOBAL ERROR HANDLING
===================================================== */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "Global JavaScript error:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "Unhandled promise rejection:",
            event.reason
        );

    }
);

</script>

</body>
</html>
